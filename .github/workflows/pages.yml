# pages —— 把 pages/ 目录发布到 GitHub Pages
#
# 为什么不用 upload-pages-artifact + deploy-pages：
# 那套依赖 GitHub 的 artifact 服务，2026-11-26 一天抽风 4 次
# （"Fetching artifact metadata failed"，重跑才成功）。
# 现在改成直接 push 到 gh-pages 分支，GitHub 从分支发布——少一环，也少一个失败点。
name: pages

on:
  push:
    branches: [main]
    paths: ["pages/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish pages/ to gh-pages branch
        run: |
          set -e
          cd pages
          git init -q -b gh-pages
          git config user.name "AIcode"
          git config user.email "aicode@local"
          git add -A
          git commit -q -m "deploy: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git push -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
          echo "已发布到 gh-pages 分支"
