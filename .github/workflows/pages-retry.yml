# pages-retry —— pages 部署失败时自动重跑（最多 3 次）
#
# 为什么需要：GitHub 自己的 artifact 服务偶尔抽风，pages 部署会报
#   "Fetching artifact metadata failed. Is githubstatus.com reporting issues..."
# 跟我们的内容无关（2026-11-26 一天遇到 4 次），重跑就好。这个 workflow 替人重跑。
name: pages-retry

on:
  workflow_run:
    workflows: ["pages"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    # 只在 pages 失败、且还没到 3 次时重跑
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed pages deployment
        run: |
          echo "pages 失败（attempt ${{ github.event.workflow_run.run_attempt }}），自动重跑..."
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/rerun"
          echo "已提交重跑"
