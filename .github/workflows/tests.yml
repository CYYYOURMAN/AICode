name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run gateway tests
        run: python3 -m unittest discover -s tests -v
